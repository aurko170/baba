name: Build Hobu Baba APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --project-name=hobu_baba .
      - name: Configure Android manifest and desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          for permission in ['android.permission.INTERNET','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.POST_NOTIFICATIONS','android.permission.RECEIVE_BOOT_COMPLETED']:
            if permission not in s:
              s=s.replace('<application',f'<uses-permission android:name="{permission}"/>\n    <application',1)
          s=re.sub(r'android:label="[^"]*"','android:label="হবু বাবা"',s,count=1)
          if 'ScheduledNotificationReceiver' not in s:
            receivers='<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>'
            s=s.replace('</application>',receivers+'</application>')
          p.write_text(s)
          g=Path('android/app/build.gradle.kts')
          if g.exists():
            v=g.read_text()
            if 'isCoreLibraryDesugaringEnabled' not in v:
              v=v.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
              v+='\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
            g.write_text(v)
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hobu-baba-updated-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
