name: hobu_baba
description: "গর্ভকালীন সময়ে হবু বাবাদের জন্য সম্পূর্ণ বাংলা গাইড, এআই এক্সপার্ট পরামর্শক, বাজেট ও হসপিটাল ব্যাগ চেকলিস্ট।"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.2
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/notifications.json
    - assets/data/hospitals.json
    - assets/data/rotating_tips.json
    - assets/branding/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: '#E9FFF4'
  adaptive_icon_foreground: assets/branding/app_icon.png
